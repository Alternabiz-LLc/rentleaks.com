  <div class="tahoe-content">
    <div id="rl-header"></div>

      <section class="hero">
        <div class="hero__inner">
          <h1 class="hero__title">Rechercher un logement flexible</h1>
          <p class="hero__subtitle">Filtrez par type de séjour, ville, budget tout compris, période d'emménagement et indispensables. Courte durée veut dire 30 jours minimum.</p>
          <div class="search-card">
            <form class="search-form" action="rent.html" aria-label="Rechercher">
              <div class="search-form__row">
                <div class="search-field search-field--city"><select id="city" name="city" aria-label="Ville"></select></div>
                <div class="search-field search-field--type"><select id="housing-type" name="type" aria-label="Type de séjour"></select></div>
                <div class="search-field search-field--location"><input type="text" id="location" name="q" placeholder="Quartier ou mot-clé" aria-label="Quartier"></div>
                <div class="search-field search-field--price">
                  <input type="number" id="price-min" name="min" placeholder="Min" min="0" aria-label="Tout compris min.">
                  <span class="search-field__sep">–</span>
                  <input type="number" id="price-max" name="max" placeholder="Max" min="0" aria-label="Tout compris max.">
                </div>
                <div class="search-field search-field--stay">
                  <select id="min-stay" name="stay" aria-label="Durée du séjour">
                    <option value="">Durée du séjour</option>
                    <option value="1">1 mois accepté</option>
                    <option value="3">Jusqu'à 3 mois</option>
                    <option value="6">Jusqu'à 6 mois</option>
                    <option value="12">Jusqu'à 12 mois</option>
                  </select>
                </div>
                <div class="search-field"><input type="date" id="move-in" name="moveIn" aria-label="Emménager avant le"></div>
                <button type="submit" class="btn btn--primary btn--search">Rechercher</button>
              </div>
            </form>
          </div>
        </div>
      </section>
      <section id="listings" class="listings-section">
        <div class="container">
          <div class="rl-adv">
            <label class="rl-check"><input type="checkbox" id="filter-furnished"> Entièrement meublé</label>
            <label class="rl-check"><input type="checkbox" id="filter-pets"> Animaux acceptés</label>
            <label class="rl-check"><input type="checkbox" id="filter-bath"> Salle de bain privative</label>
            <label class="rl-check"><input type="checkbox" id="filter-work"> Espace de travail</label>
            <label class="rl-check"><input type="checkbox" id="filter-nofee"> Sans honoraires d'agence</label>
            <label class="rl-check"><input type="checkbox" id="filter-utils"> Charges comprises</label>
            <label class="rl-check"><input type="checkbox" id="filter-verified"> Hôte vérifié</label>
          </div>
          <div class="listings__top">
            <h2 class="listings__count" id="listings-count">0</h2>
            <div class="rl-view" role="group" aria-label="Affichage">
              <button type="button" class="is-on" data-view="grid">Grille</button>
              <button type="button" data-view="list">Liste</button>
              <button type="button" data-view="map">Carte</button>
            </div>
            <div class="listings__sort">
              <label for="sort">Trier</label>
              <select id="sort" name="sort">
                <option value="newest">Plus récentes</option>
                <option value="price-asc">Tout compris : croissant</option>
                <option value="price-desc">Tout compris : décroissant</option>
                <option value="move-in">Emménagement le plus proche</option>
                <option value="match">Meilleur Stay DNA</option>
              </select>
            </div>
          </div>
