  <div class="tahoe-content">
    <div id="rl-header"></div>
    <main id="main">
      <section class="hero">
        <div class="hero__inner">
          <h1 class="hero__title">Flexibles Wohnen suchen</h1>
          <p class="hero__subtitle">Filtern Sie nach Wohnform, Stadt, Warmmiete-Budget, Einzugszeitraum und Muss-Kriterien. Kurzzeit heißt 30 Tage oder länger.</p>
          <div class="search-card">
            <form class="search-form" action="rent.html" aria-label="Suchen">
              <div class="search-form__row">
                <div class="search-field search-field--city"><select id="city" name="city" aria-label="Stadt"></select></div>
                <div class="search-field search-field--type"><select id="housing-type" name="type" aria-label="Wohnform"></select></div>
                <div class="search-field search-field--location"><input type="text" id="location" name="q" placeholder="Stadtteil oder Stichwort" aria-label="Stadtteil"></div>
                <div class="search-field search-field--price">
                  <input type="number" id="price-min" name="min" placeholder="Min" min="0" aria-label="Warmmiete ab">
                  <span class="search-field__sep">–</span>
                  <input type="number" id="price-max" name="max" placeholder="Max" min="0" aria-label="Warmmiete bis">
                </div>
                <div class="search-field search-field--stay">
                  <select id="min-stay" name="stay" aria-label="Mietdauer">
                    <option value="">Mietdauer</option>
                    <option value="1">1 Monat möglich</option>
                    <option value="3">Bis 3 Monate</option>
                    <option value="6">Bis 6 Monate</option>
                    <option value="12">Bis 12 Monate</option>
                  </select>
                </div>
                <div class="search-field"><input type="date" id="move-in" name="moveIn" aria-label="Einzug bis"></div>
                <button type="submit" class="btn btn--primary btn--search">Suchen</button>
              </div>
            </form>
          </div>
        </div>
      </section>
      <section id="listings" class="listings-section">
        <div class="container">
          <div class="rl-adv">
            <label class="rl-check"><input type="checkbox" id="filter-furnished"> Voll möbliert</label>
            <label class="rl-check"><input type="checkbox" id="filter-pets"> Haustiere erlaubt</label>
            <label class="rl-check"><input type="checkbox" id="filter-bath"> Eigenes Bad</label>
            <label class="rl-check"><input type="checkbox" id="filter-work"> Arbeitsplatz</label>
            <label class="rl-check"><input type="checkbox" id="filter-nofee"> Provisionsfrei</label>
            <label class="rl-check"><input type="checkbox" id="filter-utils"> Nebenkosten inklusive</label>
            <label class="rl-check"><input type="checkbox" id="filter-verified"> Geprüfter Anbieter</label>
          </div>
          <div class="listings__top">
            <h2 class="listings__count" id="listings-count">0</h2>
            <div class="rl-view" role="group" aria-label="Ansicht">
              <button type="button" class="is-on" data-view="grid">Kacheln</button>
              <button type="button" data-view="list">Liste</button>
              <button type="button" data-view="map">Karte</button>
            </div>
            <div class="listings__sort">
              <label for="sort">Sortieren</label>
              <select id="sort" name="sort">
                <option value="newest">Neueste</option>
                <option value="price-asc">Warmmiete: aufsteigend</option>
                <option value="price-desc">Warmmiete: absteigend</option>
                <option value="move-in">Frühester Einzug</option>
                <option value="match">Beste Stay DNA</option>
              </select>
            </div>
          </div>
          <div class="listings__grid" id="listings-grid"></div>
          <div class="listings__empty" id="listings-empty" hidden></div>
          <div id="rl-suggest" class="rl-block" hidden></div>
        </div>
