services:
  db:
    image: postgres:16-alpine
    container_name: rentleaks-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: rentleaks
      POSTGRES_PASSWORD: rentleaks
      POSTGRES_DB: rentleaks
    volumes:
      - rentleaks_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentleaks -d rentleaks"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  rentleaks_pg:
