    <div class="tahoe-orb tahoe-orb--1"></div>

  <a href="#main" class="skip-link">Skip to main content</a>
  <div class="tahoe-content">
    <div id="rl-header"></div>
    <main id="main">
      <section class="hero">
        <div class="hero__inner">
          <h1 class="hero__title">Search flexible housing</h1>
          <p class="hero__subtitle">Filter by stay type, city, all-in budget, move-in window, and must-haves. Short-term means 30 days or more.</p>
          <div class="search-card">
            <form class="search-form" action="rent.html" aria-label="Search listings">
              <div class="search-form__row">
                <div class="search-field search-field--city">
                  <select id="city" name="city" aria-label="City"></select>
                </div>
                <div class="search-field search-field--type">
                  <select id="housing-type" name="type" aria-label="Stay type"></select>
                </div>
                <div class="search-field search-field--location">
                  <input type="text" id="location" name="q" placeholder="Neighborhood or keyword" aria-label="Neighborhood">
                </div>
                <div class="search-field search-field--price">
                  <input type="number" id="price-min" name="min" placeholder="Min" min="0" aria-label="Min all-in">
                  <span class="search-field__sep">–</span>
                  <input type="number" id="price-max" name="max" placeholder="Max" min="0" aria-label="Max all-in">
                </div>
                <div class="search-field search-field--stay">
                  <select id="min-stay" name="stay" aria-label="Stay length">
                    <option value="">Stay length</option>
                    <option value="1">1 month ok</option>
                    <option value="3">Up to 3 months</option>
                    <option value="6">Up to 6 months</option>
                    <option value="12">Up to 12 months</option>
                  </select>
                </div>
                <div class="search-field">
                  <input type="date" id="move-in" name="moveIn" aria-label="Move in by">
                </div>
                <button type="submit" class="btn btn--primary btn--search">Search</button>
              </div>
            </form>
          </div>
        </div>
      </section>
      <section id="listings" class="listings-section">
        <div class="container">
          <div class="rl-adv">
            <label class="rl-check"><input type="checkbox" id="filter-furnished"> Fully furnished</label>
            <label class="rl-check"><input type="checkbox" id="filter-pets"> Pets ok</label>
            <label class="rl-check"><input type="checkbox" id="filter-bath"> Private bath</label>
            <label class="rl-check"><input type="checkbox" id="filter-work"> Workspace</label>
            <label class="rl-check"><input type="checkbox" id="filter-nofee"> No broker fee</label>
            <label class="rl-check"><input type="checkbox" id="filter-utils"> Utilities included</label>
            <label class="rl-check"><input type="checkbox" id="filter-verified"> Verified host</label>
          </div>
          <div class="listings__top">
            <h2 class="listings__count" id="listings-count">0 homes</h2>
            <div class="rl-view" role="group" aria-label="View">
              <button type="button" class="is-on" data-view="grid">Grid</button>
              <button type="button" data-view="list">List</button>
              <button type="button" data-view="map">Map</button>
            </div>
            <div class="listings__sort">
              <label for="sort">Sort</label>
              <select id="sort" name="sort">
                <option value="newest">Newest</option>
                <option value="price-asc">All-in: low to high</option>
                <option value="price-desc">All-in: high to low</option>
                <option value="move-in">Soonest move-in</option>
                <option value="match">Best Stay DNA</option>
              </select>
            </div>
          </div>
          <div class="listings__grid" id="listings-grid"></div>
          <div class="listings__empty" id="listings-empty" hidden></div>
          <div id="rl-suggest" class="rl-block" hidden></div>
        </div>
      </section>
    </main>
